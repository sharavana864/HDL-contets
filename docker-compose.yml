services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hdl
      POSTGRES_PASSWORD: hdl_pw
      POSTGRES_DB: hdl_contest
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed_example_contest.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hdl -d hdl_contest"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgres://hdl:hdl_pw@postgres:5432/hdl_contest
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports: ["4000:4000"]
    volumes:
      # Needed so dockerode inside the backend container can launch sibling
      # compiler containers on the host's Docker daemon.
      - /var/run/docker.sock:/var/run/docker.sock

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:4000/api
      VITE_WS_URL: http://localhost:4000
      VITE_DEFAULT_CONTEST_ID: "00000000-0000-0000-0000-000000000001"
    ports: ["5173:5173"]
    depends_on: [backend]

volumes:
  pgdata:
